<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }
    .compass-bg {
      fill: #09090b;
      stroke: #06b6d4;
      stroke-width: 2;
    }
    .ring-outer {
      stroke: #06b6d4;
      stroke-width: 1;
      opacity: 0.4;
    }
    .ring-dashed {
      stroke: #06b6d4;
      stroke-width: 1.5;
      stroke-dasharray: 4 6;
      opacity: 0.6;
    }
    .needle-group {
      transform-origin: 150px 150px;
      animation: spin 16s linear infinite;
    }
    .rotating-text {
      transform-origin: 150px 150px;
      animation: spin-reverse 30s linear infinite;
    }
    .label-text {
      font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      fill: #94a3b8;
    }
    .main-text {
      fill: #22d3ee;
      font-weight: 900;
    }
  </style>

  <!-- Background Glow Effect for Dark Themes -->
  
  <circle cx="150" cy="150" r="140" fill="rgba(6, 182, 212, 0.4)" filter="blur(20px)" opacity="0.3" />
  

  <!-- Main Base Plate -->
  <circle class="compass-bg" cx="150" cy="150" r="130" />
  
  <!-- Decorative Inner Rings -->
  <circle class="ring-outer" cx="150" cy="150" r="115" fill="none" />
  <circle class="ring-dashed" cx="150" cy="150" r="100" fill="none" />
  
  <!-- Invisible path for circular orbiting text -->
  <path id="compass-text-path" d="M 150, 150 m -82, 0 a 82,82 0 1,1 164,0 a 82,82 0 1,1 -164,0" fill="none" stroke="none" />

  <!-- Orbiting Tech Stack Words -->
  <g class="rotating-text">
    <text class="label-text" font-size="7.5px" fill="#94a3b8" letter-spacing="0.15em">
      <textPath href="#compass-text-path" startOffset="0%">DEVELOPER ✦ REACT ✦ GIT ✦ JavaScript ✦ DEVELOPER ✦ REACT ✦ GIT ✦ JavaScript ✦</textPath>
    </text>
  </g>

  <!-- Compass Graduations (Ticks) -->
  <g stroke="#06b6d4" stroke-width="1" opacity="0.4">
    <!-- 12 Cardinal Tick Marks -->
    <line x1="150" y1="23" x2="150" y2="33" />
    <line x1="150" y1="267" x2="150" y2="277" />
    <line x1="23" y1="150" x2="33" y2="150" />
    <line x1="267" y1="150" x2="277" y2="150" />
    
    <line x1="86.5" y1="86.5" x2="93.5" y2="93.5" />
    <line x1="213.5" y1="86.5" x2="206.5" y2="93.5" />
    <line x1="86.5" y1="213.5" x2="93.5" y2="206.5" />
    <line x1="213.5" y1="213.5" x2="206.5" y2="206.5" />
  </g>

  <!-- Cardinal Points Text -->
  <text class="label-text main-text" x="150" y="48" text-anchor="middle">N</text>
  <text class="label-text" x="250" y="153" text-anchor="middle">E</text>
  <text class="label-text" x="150" y="262" text-anchor="middle">S</text>
  <text class="label-text" x="50" y="153" text-anchor="middle">W</text>

  <!-- Animated Rotating Needle (Placed underneath central hub) -->
  <g class="needle-group">
    <!-- North Point (Color Theme Accent) -->
    <path d="M150 40 L158 150 L142 150 Z" fill="#06b6d4" />
    <!-- South Point (Silver-Gray Contrast) -->
    <path d="M150 260 L158 150 L142 150 Z" fill="#4b5563" />
  </g>

  <!-- Central Hub Cover Plate (Placed on top of needle to keep text static and legible) -->
  <circle cx="150" cy="150" r="36" fill="#09090b" stroke="#06b6d4" stroke-width="1.5" />
  <circle class="ring-outer" cx="150" cy="150" r="30" fill="none" />
  
  <!-- Centered Username -->
  <text x="150" y="153.5" text-anchor="middle" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="8px" font-weight="900" fill="#22d3ee" letter-spacing="0.05em">mrvolkov2</text>
</svg>
